<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">


<header class="topbar">
    <div class="brand">
        <div class="brand-icon">
            ✦
        </div>

        <div>
            <h1>Resume Analyzer</h1>
            <p>AI-powered ATS & skill match</p>
        </div>
    </div>
</header>

<div class="auth-card">

    <h2>Welcome Back</h2>

    <input
            class="auth-input"
            type="email"
            id="loginEmail"
            placeholder="Email">

    <input
            class="auth-input"
            type="password"
            id="loginPassword"
            placeholder="Password">

    <button class="primary-btn" onclick="login()">
        Sign In
    </button>

    <div class="auth-link">
        <a href="signup.html">
            Don't have an account? Sign Up
        </a>
    </div>

</div>

</div>

<script src="auth.js"></script>

</body>
</html>
